name: Deploy QRFerry to GitHub Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Turns Pages on for this repo if it is not already enabled, so no
      # manual settings change is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Base path must match how Pages serves the site: "/<repo>/" for a
      # project site, "/" for a <user>.github.io repo or a custom domain.
      - name: Export static site
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            BASE="/"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          echo "Exporting with base $BASE"
          QRF_BASE="$BASE" ./scripts/export-static.sh out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
